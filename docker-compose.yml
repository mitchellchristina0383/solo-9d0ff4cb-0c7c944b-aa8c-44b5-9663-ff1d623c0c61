services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: demo
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  api:
    build: ./app
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: demo
      PGUSER: app
      PGPASSWORD: app
      POOL_SIZE: "4"
      # 以下均为可选项，缺省使用代码内默认值：
      # CANCEL_TIMEOUT: "5"    # 等待服务端取消返回的上限（秒）
      # CLEANUP_TIMEOUT: "10"  # 单条连接清理的总预算（秒）
      # DRAIN_GRACE: "5"       # 取消成功后等查询收尾的时间（秒）
      # 演示用故障注入：hang=取消调用卡住，error=取消调用报错
      # CANCEL_FAULT: ""
      # CANCEL_FAULT_SECONDS: "20"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
